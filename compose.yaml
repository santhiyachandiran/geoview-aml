services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - SQLITE_DB_PATH=/app/data/geochange.db
      - MODEL_ARTIFACTS_DIR=/app/artifacts/models
      - EXPORT_DIR=/app/artifacts/exports
      - MLFLOW_TRACKING_URI=/app/artifacts/mlruns
      - LOG_FILE=/app/logs/geochange.log
      - MLFLOW_DISABLE_AGENT_HINT=1
    volumes:
      - backend_data:/app/data
      - backend_artifacts:/app/artifacts
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  backend_data:
  backend_artifacts:
  backend_logs: