# GeoChange AI — Satellite Data Source Configuration

sentinel2:
  collection: "COPERNICUS/S2_SR_HARMONIZED"
  resolution_m: 10
  available_from: "2017-03-28"
  bands:
    blue:  "B2"
    green: "B3"
    red:   "B4"
    nir:   "B8"
    swir1: "B11"
    swir2: "B12"
    scl:   "SCL"        # Scene Classification Layer (for cloud masking)
  cloud_mask_band: "SCL"
  cloud_mask_values: [3, 8, 9, 10, 11]  # cloud shadow, cloud, cirrus
  max_cloud_cover_pct: 20
  description: "Sentinel-2 Surface Reflectance, harmonised collection"

landsat8:
  collection: "LANDSAT/LC08/C02/T1_L2"
  resolution_m: 30
  available_from: "2013-04-11"
  bands:
    blue:  "SR_B2"
    green: "SR_B3"
    red:   "SR_B4"
    nir:   "SR_B5"
    swir1: "SR_B6"
    swir2: "SR_B7"
    qa:    "QA_PIXEL"
  cloud_mask_band: "QA_PIXEL"
  max_cloud_cover_pct: 20
  description: "Landsat 8 Collection 2 Tier 1 Surface Reflectance"

# Reference land-cover labels
worldcover:
  collection: "ESA/WorldCover/v200"
  resolution_m: 10
  available_years: [2020, 2021]
  band: "Map"
  class_mapping:
    10: "vegetation"      # Tree cover
    20: "vegetation"      # Shrubland
    30: "vegetation"      # Grassland
    40: "vegetation"      # Cropland / Agriculture
    50: "built_up"        # Built-up
    60: "bare"            # Bare / sparse vegetation
    70: "bare"            # Snow and ice
    80: "water"           # Permanent water bodies
    90: "bare"            # Herbaceous wetland
    95: "vegetation"      # Mangroves
    100: "bare"           # Moss and lichen
  label: "ESA WorldCover v2 (2021)"
  license: "CC BY 4.0"
  citation: >
    Zanaga et al. (2022). ESA WorldCover 10 m 2021 v200.
    https://doi.org/10.5281/zenodo.7254221

dynamic_world:
  collection: "GOOGLE/DYNAMICWORLD/V1"
  resolution_m: 10
  available_from: "2015-06-23"
  label_band: "label"
  probability_bands:
    - "water"
    - "trees"
    - "grass"
    - "flooded_vegetation"
    - "crops"
    - "shrub_and_scrub"
    - "built"
    - "bare"
    - "snow_and_ice"
