# GeoChange AI — ML Model Configuration

# ── Features ─────────────────────────────────────────────────
features:
  spectral_bands:
    - blue
    - green
    - red
    - nir
    - swir1
    - swir2
  indices:
    - ndvi      # (NIR - Red) / (NIR + Red)
    - ndbi      # (SWIR1 - NIR) / (SWIR1 + NIR)
    - mndwi     # (Green - SWIR1) / (Green + SWIR1)
    - evi       # Enhanced Vegetation Index
    - savi      # Soil-Adjusted Vegetation Index
  elevation: true
  total_features: 12  # 6 bands + 5 indices + 1 elevation

# ── Classes ──────────────────────────────────────────────────
classes:
  0: "built_up"
  1: "vegetation"
  2: "water"
  3: "bare"
  n_classes: 4

# ── Data split (spatial, not random) ─────────────────────────
split:
  strategy: "spatial_grid"   # Split by tile grid, not random pixels
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15
  random_seed: 42

# ── Random Forest baseline ────────────────────────────────────
random_forest:
  n_estimators: 200
  max_depth: 20
  min_samples_split: 5
  min_samples_leaf: 2
  n_jobs: -1
  random_state: 42
  class_weight: "balanced"

# ── XGBoost + Optuna tuning ───────────────────────────────────
xgboost:
  optuna_trials: 50
  optuna_timeout_sec: 1800      # 30 minutes max
  cv_folds: 5
  random_state: 42
  search_space:
    n_estimators: [100, 800]
    max_depth: [3, 10]
    learning_rate: [0.01, 0.3]
    subsample: [0.6, 1.0]
    colsample_bytree: [0.6, 1.0]
    reg_alpha: [0.0, 1.0]
    reg_lambda: [1.0, 10.0]

# ── Evaluation metrics ───────────────────────────────────────
evaluation:
  primary_metric: "macro_f1"
  additional_metrics:
    - accuracy
    - per_class_f1
    - confusion_matrix
    - mean_iou
    - pr_auc
    - roc_auc
